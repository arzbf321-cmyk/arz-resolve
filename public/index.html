<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arz Link Resolver</title>
    <style>
        /* Gaya Neo-Brutalism Simpel */
        body {
            background: #ffde59;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            text-transform: uppercase;
            background: #00ffff;
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid #000;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 3px solid #000;
            font-family: monospace;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            background: #f4f4f4;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #ff2a2a;
            color: #fff;
            border: 3px solid #000;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: 0.1s;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 3px solid #000;
            background: #00ff00;
            word-break: break-all;
        }
        .error { background: #ff2a2a !important; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Link Resolver</h1>
        <input type="text" id="linkInput" placeholder="Tempel link Mediafire di sini...">
        <button onclick="resolveLink()">Resolve Link</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function resolveLink() {
            const url = document.getElementById('linkInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!url) return alert('Isi link dulu!');

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Memproses...';
            resultDiv.className = '';

            try {
                const response = await fetch('/api/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                if (data.status) {
                    // Tombol buat nembak ke direct link Mediafire
                    resultDiv.innerHTML = `
                        <b>File:</b> ${data.filename} <br><br>
                        <a href="${data.direct_url}" target="_blank" style="color:#000; font-weight:bold;">
                            > KLIK UNTUK DOWNLOAD <
                        </a>
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `Gagal: ${data.message}`;
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = 'Terjadi kesalahan server.';
            }
        }
    </script>
</body>
</html>
